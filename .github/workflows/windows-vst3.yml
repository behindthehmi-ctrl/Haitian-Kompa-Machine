name: Build Windows VST3
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: master
          path: JUCE
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_SOURCE_DIR="${{ github.workspace }}/JUCE"
      - name: Build
        run: cmake --build build --config Release --target HaitianKompaMachine_VST3 --parallel 2
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haitian-Kompa-Machine-Windows-VST3
          path: build/HaitianKompaMachine_artefacts/Release/VST3/
          if-no-files-found: error
